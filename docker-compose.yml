name: secure-hermes-sandbox

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  pasteguard:
    image: ghcr.io/sgasser/pasteguard:eu
    container_name: secure-hermes-pasteguard
    networks:
      - secure-search-net
    depends_on:
      presidio-analyzer:
    environment:
      # Provider endpoints (these are the env names referenced in the Pasteguard config)
      OPENAI_PROVIDER_URL: ${OPENAI_PROVIDER_URL:-https://openrouter.ai/api/v1}
      ANTHROPIC_PROVIDER_URL: ${ANTHROPIC_PROVIDER_URL:-https://api.anthropic.com}
      CODEX_PROVIDER_URL: ${CODEX_PROVIDER_URL:-https://chatgpt.com/backend-api/codex}

      # Use PasteGuard's own internal Presidio (runs on :5002 inside the container via supervisord)
      PRESIDIO_ANALYZER_URL: ${PRESIDIO_ANALYZER_URL:-http://localhost:5002}

      # Languages must match the spaCy models baked into the PasteGuard eu image
      PASTEGUARD_LANGUAGES: ${PASTEGUARD_LANGUAGES:-en,de}

      # Optional dashboard password (left unset by default)
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    volumes:
      - ./pasteguard/config.yaml:/pasteguard/config.yaml:ro
      - ./pasteguard/data:/data  # for sqlite DB and logs (matches logging.database path)
    ports:
      - "3100:3000"   # PasteGuard proxy
      - "5001:5002"   # Presidio analyzer (internal, exposed for host access and sanitizer-proxy)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s  # eu image loads 9 spaCy models; Presidio needs extra time
    logging: *default-logging

  firecrawl-redis:
    image: redis:alpine
    container_name: secure-hermes-firecrawl-redis
    networks: [secure-search-net]
    command: redis-server --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    container_name: secure-hermes-firecrawl-rabbitmq
    networks: [secure-search-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: secure-hermes-firecrawl-postgres
    networks: [secure-search-net]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    logging: *default-logging

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: secure-hermes-firecrawl-playwright
    networks: [secure-search-net]
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: "10"
    logging: *default-logging

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: secure-hermes-firecrawl
    networks: [secure-search-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      INTERNAL_PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      ENV: local
      REDIS_URL: "redis://firecrawl-redis:6379"
      REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
      PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000/scrape"
      NUQ_RABBITMQ_URL: "amqp://firecrawl-rabbitmq:5672"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
      POSTGRES_HOST: "firecrawl-postgres"
      POSTGRES_PORT: "5432"
      USE_DB_AUTHENTICATION: "false"
      NUM_WORKERS_PER_QUEUE: "8"
      CRAWL_CONCURRENT_REQUESTS: "10"
      MAX_CONCURRENT_JOBS: "5"
      BROWSER_POOL_SIZE: "5"
      LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
      SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT:-}
      SEARXNG_ENGINES: ${SEARXNG_ENGINES:-}
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_started
    ports:
      - "3002:3002"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging: *default-logging

  sanitizer-proxy:
    build: ./sanitizer_proxy
    container_name: secure-hermes-sanitizer-proxy
    networks: [secure-search-net]
    environment:
      PASTEGUARD_URL: "http://pasteguard:3000"
      FIRECRAWL_URL: "http://firecrawl:3002"
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      REQUEST_TIMEOUT_SECONDS: "30"
      LOG_LEVEL: "INFO"
    ports:
      # 5050 on host (macOS AirPlay binds 5000); container still on 5000.
      - "5050:5000"
    depends_on:
      pasteguard:
        condition: service_healthy
      firecrawl:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging

networks:
  secure-search-net:
    name: secure-search-net
    driver: bridge
