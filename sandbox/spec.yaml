schemaVersion: '1'
kind: mixin
name: hermes-secure
displayName: Hermes (Secure Sandbox)
description: >-
  Mixin on top of the built-in `shell` agent. Installs Hermes and points
  its web search at a host-side Presidio + Firecrawl proxy. LLM credentials
  (anthropic, openai, openrouter) are already proxy-managed by `shell` — we
  only add Hermes-specific config here.

network:
  allowedDomains:
    - 'host.docker.internal:5050'
    - 'localhost:5050'
    - 'portal.nousresearch.com:443'
    - 'inference-api.nousresearch.com:443'
    - 'raw.githubusercontent.com:443'
    - 'github.com:443'
    - 'codeload.github.com:443'
    - 'objects.githubusercontent.com:443'
    - 'api.github.com:443'
    - 'astral.sh:443'
    - 'releases.astral.sh:443'
    - 'pypi.org:443'
    - 'files.pythonhosted.org:443'
    - 'deb.debian.org:80'
    - 'security.debian.org:80'
    - 'openrouter.ai:443'
  serviceDomains:
    openrouter.ai: openrouter # Tag traffic to this domain
  serviceAuth:
    openrouter:
      headerName: Authorization # Overwrite this header
      valueFormat: "Bearer %s"

credentials:
  sources:
    openrouter: 
      file: 
        path: "/home/chris/Repositories/secure-hermes-sandbox/sandbox/openrouter.key"
      # env:
      #   - OPENROUTER_GENERAL_API_KEY # Host-side credential lookup

environment:
  variables:
    FIRECRAWL_API_URL: 'http://host.docker.internal:5050'
    TIRITH_BASH_MODE: 'enter'
  proxyManaged:
    - OPENROUTER_API_KEY # Set the in-VM env var to "proxy-managed"

commands:
  install:
    - command: 'curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash'
      user: '1000'
      description: Install NousResearch Hermes Agent
    - command: |
        mkdir -p /home/agent/.hermes
        cat > /home/agent/.hermes/config.yaml <<'YAML'
        terminal:
          backend: local
        agent:
          disabled_toolsets:
            - browser
        web:
          backend: firecrawl
        YAML
      user: '1000'
      description: >-
        Write Hermes config: pin terminal to local (the microVM is the sandbox),
        disable the browser toolset (no in-VM Chromium; would bypass the proxy),
        and pin web search to Firecrawl so all web traffic goes via FIRECRAWL_API_URL.
    - command: 'curl -fsSL https://raw.githubusercontent.com/sheeki03/tirith/main/scripts/install.sh | bash && eval "$(tirith init)"'
      user: '1000'
      description: Install NousResearch Hermes Agent
